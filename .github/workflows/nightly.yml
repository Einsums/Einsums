name: Nightly

# Must stay a superset of cmake.yml; nothing enforces it. Deliberate differences:
# no path filtering (a nightly should catch what filters miss), no intel leg (manual only), and
# macOS in Debug rather than RelWithDebInfo.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-build-and-test.yml
    with:
      long_fuzz: true
      sde: true

  windows:
    name: Windows
    uses: ./.github/workflows/windows-build-and-test.yml

  # Debug only: the RelWithDebInfo build already runs on every push, and Debug is the build that
  # turns EINSUMS_ASSERT on.
  macos_debug:
    name: macOS (Debug)
    uses: ./.github/workflows/macos-build-and-test.yml
    with:
      build_type: Debug

  # TSan only: the address,leak,undefined leg loses its runner mid-build (unexplained, likely memory).
  # Run it by dispatching the Sanitizers workflow with full_matrix.
  sanitizers:
    name: Sanitizers
    uses: ./.github/workflows/linux-build-and-test-sanitizer.yml

  # Build only; deploys are gated to push/dispatch. docs.yml needs contents: write, and a called
  # workflow cannot exceed its caller's permissions, so grant it here, not file-wide.
  documentation:
    name: Documentation
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
