name: Windows build and test workflow
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ RelWithDebInfo, Debug ]

    name: "clang-cl • openblas • ${{ matrix.build_type }}"
    runs-on: windows-2022
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          path: src
          
      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ github.sha }}
          restore-keys: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-


      # ---- Conda environment setup ----
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: einsums-env
          conda-remove-defaults: "true"

      - name: Install ruamel.yaml
        run: conda install -c conda-forge ruamel.yaml

      - name: Merge Conda YAML files
        working-directory: src/devtools/conda-envs
        run: python merge_yml.py windows openblas
        
      - name: Get Week
        id: get-date
        run: echo "week=$(/bin/date -u '+%W')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Conda env
        uses: actions/cache@v6
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}-${{ runner.arch }}-${{steps.get-date.outputs.week}}-${{ hashFiles('src/devtools/conda-envs/conda.yml') }}
        id: cache

      - name: Update environment
        run: conda env update -n einsums-env -f src/devtools/conda-envs/conda.yml
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Conda Environment
        run: |
          conda info
          conda list

      # ---- Configure, Build, Test ----
      # vs2022_compiler_vars.bat calls vcvars; no separate vcvars / GITHUB_ENV merge.
      # pwsh activate skips this scripts and would set clang/clang++ instead of clang-cl.
      - name: Configure CMake
        shell: cmd
        run: |
          call conda activate einsums-env
          if errorlevel 1 exit /b %ERRORLEVEL%

          rem Clear feedstock flags (/std:c++17, /O2, -DNDEBUG, ...) for CMake
          set "CXXFLAGS="
          set "CFLAGS="
          set "CPPFLAGS="
          rem vs2022_compiler_vars sets these for VS; Ninja rejects any -A/-T
          rem (including empty). Must unset here — preset env cannot clear them.
          set "CMAKE_GENERATOR_PLATFORM="
          set "CMAKE_GENERATOR_TOOLSET="
          set "CMAKE_GENERATOR="
          set "CC=%CONDA_PREFIX%\Library\bin\clang-cl.exe"
          set "CXX=%CONDA_PREFIX%\Library\bin\clang-cl.exe"

          cmake -G Ninja ^
            -S "%GITHUB_WORKSPACE%\src" ^
            -B "%GITHUB_WORKSPACE%\build" ^
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
            -D CMAKE_C_COMPILER="%CC%" ^
            -D CMAKE_CXX_COMPILER="%CXX%" ^
            -D CMAKE_C_COMPILER_LAUNCHER=ccache ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -D CMAKE_PREFIX_PATH="%CONDA_PREFIX%\Library" ^
            -D EINSUMS_BUILD_PYTHON=ON ^
            -D EINSUMS_WITH_TESTS=ON ^
            -D EINSUMS_WITH_EXAMPLES=OFF ^
            -D EINSUMS_WITH_BACKTRACES=ON ^
            -D EINSUMS_SHOW_WARNING=OFF ^
            -D CMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\installed" ^
            ${{ inputs.build_configure_extra_args }}

      - name: Build
        shell: cmd
        run: |
          call conda activate einsums-env
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build "%GITHUB_WORKSPACE%\build" --config ${{ matrix.build_type }}

      - name: Test (CTest)
        shell: cmd
        working-directory: ${{ github.workspace }}/build
        run: |
          call conda activate einsums-env
          if errorlevel 1 exit /b %ERRORLEVEL%
          rem DLL search path: Einsums, spdlog, conda, mingw64 runtime
          set "PATH=%GITHUB_WORKSPACE%\build\${{ matrix.build_type }}\bin;%GITHUB_WORKSPACE%\build\_deps\spdlog-build;%CONDA_PREFIX%\Library\bin;%CONDA_PREFIX%\Library\mingw64\bin;%PATH%"
          ctest -j4 --output-on-failure

      - name: Install
        shell: cmd
        working-directory: "${{github.workspace}}/build"
        run: |
          call conda activate einsums-env
          cmake --install . --prefix %GITHUB_WORKSPACE%\installed

      - name: Test (pytest) - unit tests
        shell: cmd
        working-directory: "${{github.workspace}}/installed/lib"
        run: |
          call conda activate einsums-env
          set "PYTHONPATH=${{github.workspace}}\installed\lib;${{github.workspace}}\installed\lib\einsums;%PYTHONPATH%;%CONDA_PREFIX%/lib"
          set "PATH=%PATH%;${{github.workspace}}\installed\bin"
          echo "%PATH%"
          echo "%PYTHONPATH%"
          pytest --rootdir "${{github.workspace}}\installed\lib\einsums" -m "not slow"
